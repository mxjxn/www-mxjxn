projects:
  - name: logseqd + Hermes knowledge workflow
    url: https://github.com/mxjxn/logseqd
    period: 2026 — present
    description: >-
      Logseq caught my interest because it organizes documents into blocks. That
      structure turned out to make a useful brain for Hermes. I wanted my agent and
      my other tools to work from the same notes, so I decided to build logseqd to
      make them quickly queryable. I worked with Hermes on the implementation and
      built a mobile interface so I could use the system from my phone.
    tech:
      - Clojure
      - DataScript
      - HTTP API
      - Hermes
      - PWA
  - name: Suchbot
    url: https://farcaster.xyz/suchbot
    period: 2026 — present
    description: >-
      Suchbot is the public face of my Hermes experiments throughout 2026. It
      publishes in-depth reports to its own blog every day and gives people access
      to creative tools directly in the Farcaster timeline. People can chain dozens
      of image commands together. I've refined its writing standards to avoid
      clichés and connected it to Logseq, with public documents available to timeline
      interactions and private work kept separate.
    tech:
      - Hermes
      - MCP
      - Third-party APIs
      - Webhooks
      - Farcaster
  - name: Cryptoart Auctionhouse
    url: https://cryptoart.social
    period: 2025 — present
    description: >-
      I built cryptoart.social because I wanted to use Manifold's marketplace
      contracts through Farcaster. I cloned the contracts, deployed a new subgraph,
      and built the site around them. Artists receive notifications when bids come
      in, and bidders hear when they've been outbid, helping keep them involved in
      the auction. I'm now expanding it into a broader marketplace, with work in
      progress on NFT liquidity pools, a Farcaster client, and curated galleries
      that can earn referral fees through auctionhouse links.
    tech:
      - Solidity / Foundry
      - TypeScript
      - PostgreSQL
      - React
      - On-chain indexing
